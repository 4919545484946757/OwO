[package]
name = "owo-agent-desktop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

# 独立于 agent-sdk workspace：避免 tauri 重依赖拖慢核心构建。
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"

[profile.dev]
incremental = true
