[package]
name = "owo-agent-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
owo-agent-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
reqwest.workspace = true
uuid.workspace = true
chrono.workspace = true
base64.workspace = true
tracing.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[[bin]]
name = "owo-mcp-test-server"
path = "src/bin/mcp_test_server.rs"

[[bin]]
name = "owo-mcp-http-test-server"
path = "src/bin/mcp_http_test_server.rs"
